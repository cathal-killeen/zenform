[project]
name = "zenform"
version = "0.1.0"
description = "Zen browser as code: keep your pins, essentials and folders in readable files, then plan and apply them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cathal Killeen" }]
requires-python = ">=3.11"
keywords = ["zen-browser", "config-as-code", "dotfiles", "pinned-tabs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
    "Operating System :: MacOS",
]
dependencies = []  # standard library only, on purpose: see AGENTS.md

[project.scripts]
zenform = "zenform.cli:main"

[project.urls]
Homepage = "https://github.com/cathal-killeen/zenform"
Source = "https://github.com/cathal-killeen/zenform"
Issues = "https://github.com/cathal-killeen/zenform/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zenform"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
