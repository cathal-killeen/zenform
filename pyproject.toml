[project]
name = "zenform"
version = "0.1.0"
description = "Zen browser as code: keep your pins, essentials and folders in readable files, then plan and apply them."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["zen-browser", "config-as-code", "dotfiles", "pinned-tabs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []  # standard library only, on purpose: see AGENTS.md

[project.scripts]
zenform = "zenform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zenform"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
