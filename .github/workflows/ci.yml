name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (standard library only, warnings are errors)
        run: PYTHONPATH=src python -W error -m unittest discover -s tests
      - name: The built wheel ships the example configs and runs
        run: |
          pip install build
          python -m build --wheel
          python -m zipfile -l dist/*.whl | grep -q "example_configs/minimal/zenform.toml"
          pip install dist/*.whl
          zenform examples

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check .
