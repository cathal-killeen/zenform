name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (standard library only, warnings are errors)
        run: PYTHONPATH=src python -W error -m unittest discover -s tests
      - name: The example config is valid
        run: PYTHONPATH=src python -c "from zenform import config, model; s = config.load_config('examples/config'); assert not model.validate_spec(s), model.validate_spec(s); assert not model.warnings(s), model.warnings(s)"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check .
